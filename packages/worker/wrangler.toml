name = "imagerepo-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev hostname (needed until a custom domain is attached),
# but turn off per-version preview URLs: they add publicly reachable hostnames
# for every deployment, which is attack surface a private API has no use for.
workers_dev = true
preview_urls = false

# Fill database_id from:  npx wrangler d1 create imagerepo
[[d1_databases]]
binding = "DB"
database_name = "imagerepo"
database_id = "1db2d100-8323-4347-a801-6d7096adc7bb"
# `wrangler d1 migrations apply` (run by `npm run deploy`) records each file it
# applies in the d1_migrations table, so only new ones run.
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "imagerepo"

[vars]
# Your Cloudflare Access team domain, e.g. "myteam" for myteam.cloudflareaccess.com.
# Leave blank until Access is configured — admin routes still work via ADMIN_TOKEN.
ACCESS_TEAM = "late-dew-7d1b"
# The Access application audience (AUD) tag, from the app's settings page.
ACCESS_AUD = "8522b25f12118db302869ff8bc23a8acbaa29b384c5cdd7fde09ffbf7f49ab53"

# Browser uploads go straight to R2 through presigned URLs (src/s3.ts), which
# need R2's S3 API: the account id here, and an R2 API token's key pair as
# secrets. Until both are set, uploads answer 503.
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "imagerepo"
# Client ID of the processing service's Access service token. Requests with
# that token are held to the few routes the service needs (src/auth.ts).
PREPROCESS_CLIENT_ID = ""

# Secrets (never in this file):
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put SHARE_HMAC_KEY
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY

# The SPA is served by this same Worker, not a separate Pages project, so that
# Cloudflare Access's CF_Authorization cookie covers both the app and the API.
# A different origin would not receive that cookie.
[assets]
directory = "../web/dist"
# Named binding is required for env.ASSETS.fetch(), which the /s/:token route
# uses to hand the app shell to a guest.
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/a/*", "/admin/*", "/s/*"]
